
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具箱 - LC的个人网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f0f0f0;
            color: #333;
            padding-bottom: 80px; /* 为固定底部的按钮留出空间 */
        }
        .header {
            background-color: #CCCC99;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .logo-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }
        .logo {
            width: 50px;
            height: 50px;
            margin-right: 15px;
        }
        .site-title {
            font-size: 24px;
            font-weight: bold;
        }
        .nav-bar {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }
        .nav-item {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            margin: 0 10px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .nav-item:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        .tools-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }
        .tool-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .tool-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }
        .tool-thumbnail {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .tool-info {
            padding: 20px;
        }
        .tool-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .tool-description {
            color: #666;
            margin-bottom: 15px;
        }
        .use-button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #CCCC99;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .use-button:hover {
            background-color: #ddddaa;
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
        }
        /* 返回按钮样式 */
        .back-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #CCCC99;
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s;
        }
        .back-button:hover {
            background-color: #ddddaa;
        }
        /* 左上角返回首页按钮样式 */
        .home-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #CCCC99;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .home-button:hover {
            background-color: #ddddaa;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo-bar">
        <div class="site-title">工具箱</div>
        </div>
    </header>
    <main class="tools-container">
        <!-- 补光灯工具 -->
        <div class="tool-card">
            <!-- 更换补光灯工具的图片 -->
            <img src="dl.jpg" alt="补光灯工具" class="tool-thumbnail">
            <div class="tool-info">
                <h3 class="tool-title">补光灯</h3>
                <p class="tool-description">增强图片亮度，改善光线不足的情况，让图片更加清晰。</p>
                <a href="pgd.html" class="use-button">使用工具</a>
            </div>
        </div>
        
        <!-- 缩放图片工具 -->
        <div class="tool-card">
            <img src="https://picsum.photos/seed/zoom/600/400" alt="缩放图片工具" class="tool-thumbnail">
            <div class="tool-info">
                <h3 class="tool-title">缩放图片</h3>
                <p class="tool-description">调整图片尺寸，支持按比例缩放或自定义尺寸，方便分享和使用。</p>
                <a href="zpsf.html" class="use-button">使用工具</a>
            </div>
        </div>
        
        <!-- 秒表工具 -->
        <div class="tool-card">
            <img src="https://picsum.photos/seed/stopwatch/600/400" alt="秒表工具" class="tool-thumbnail">
            <div class="tool-info">
                <h3 class="tool-title">秒表工具</h3>
                <p class="tool-description">精确计时工具，可用于运动计时、烹饪计时等各种需要计时的场景。</p>
                <a href="mb.html" class="use-button">使用工具</a>
            </div>
        </div>
        
        <!-- 可以在这里添加更多工具... -->
    </main>
    <footer class="footer">
        <p>© 2025 LC的个人网站 | 工具箱</p>
    </footer>
    
    <!-- 返回按钮 -->
    <button class="back-button" onclick="history.back()">
        ←
    </button>
</body>
</html>
