<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密室逃脱 - 第三关</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #222;
            color: white;
        }
        
        #game-container {
            position: relative;
            width: 1280px;
            margin: 0 auto;
        }
        
        #room-image {
            display: block;
            width: 100%;
            height: auto;
        }
        
        .hotspot {
            position: absolute;
            cursor: pointer;
            /* 调试时可以取消下面的注释显示热点区域 */
            /* background-color: rgba(255, 0, 0, 0.3); */
        }
        
        .tooltip {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
            display: none;
            width: 200px;
            text-align: center;
        }
        
        #password-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 10px;
            z-index: 200;
            display: none;
            text-align: center;
            width: 300px;
        }
        
        #password-input {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }
        
        #password-input input {
            width: 40px;
            height: 40px;
            text-align: center;
            font-size: 20px;
        }
        
        #modal-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        
        #modal-buttons button {
            padding: 8px 20px;
            cursor: pointer;
        }
        
        #confirm-password {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
        
        #cancel-password {
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 5px;
        }
        
        #success-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 10px;
            z-index: 200;
            display: none;
            text-align: center;
            width: 300px;
        }
        
        #success-message button {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 8px 20px;
            margin-top: 15px;
            cursor: pointer;
        }
        
        #trap-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 10px;
            z-index: 200;
            display: none;
            text-align: center;
            width: 300px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <img id="room-image" src="room3.png" alt="密室第三关">
        
        <!-- 打印机提示区域 -->
        <div class="hotspot" style="left: 169px; top: 619px; width: 219px; height: 109px;" onclick="showPrinterTooltip()"></div>
        <div id="printer-tooltip" class="tooltip">
            请点击打印机
        </div>
        
        <!-- 柜子密码提示区域 -->
        <div class="hotspot" style="left: 14px; top: 827px; width: 213px; height: 63px;" onclick="showCabinetTooltip()"></div>
        <div id="cabinet-tooltip" class="tooltip">
            柜子的密码6363
        </div>
        
        <!-- 休息提示区域 -->
        <div class="hotspot" style="left: 1016px; top: 616px; width: 97px; height: 325px;" onclick="showRestTooltip()"></div>
        <div id="rest-tooltip" class="tooltip">
            找不到就休息一会吧
        </div>
        
        <!-- 陷阱密码区域 -->
        <div class="hotspot" style="left: 371px; top: 1098px; width: 56px; height: 222px;" onclick="showTrapModal()"></div>
        
        <!-- 密码输入模态框 -->
        <div id="password-modal">
            <h3>输入密码</h3>
            <div id="password-input">
                <input type="text" maxlength="1" id="digit1">
                <input type="text" maxlength="1" id="digit2">
                <input type="text" maxlength="1" id="digit3">
                <input type="text" maxlength="1" id="digit4">
            </div>
            <div id="modal-buttons">
                <button id="confirm-password" onclick="checkTrapPassword()">确认</button>
                <button id="cancel-password" onclick="hidePasswordModal()">取消</button>
            </div>
        </div>
        
        <!-- 陷阱消息 -->
        <div id="trap-message">
            <p>你上当了，这里什么都没有</p>
        </div>
        
        <!-- 出口区域 -->
        <div class="hotspot" style="left: 365px; top: 74px; width: 66px; height: 89px;" onclick="showSuccessMessage()"></div>
        
        <!-- 成功消息 -->
        <div id="success-message">
            <p>你找到了脱出这个房间的线索</p>
            <button id="leave-button" onclick="goToNextRoom()">离开</button>
        </div>
    </div>

    <script>
        // 显示打印机提示
        function showPrinterTooltip() {
            const tooltip = document.getElementById('printer-tooltip');
            tooltip.style.display = 'block';
            tooltip.style.left = '169px';
            tooltip.style.top = '550px'; // 显示在热点区域上方
            
            setTimeout(() => {
                tooltip.style.display = 'none';
            }, 2000);
        }
        
        // 显示柜子密码提示
        function showCabinetTooltip() {
            const tooltip = document.getElementById('cabinet-tooltip');
            tooltip.style.display = 'block';
            tooltip.style.left = '14px';
            tooltip.style.top = '750px'; // 显示在热点区域上方
            
            setTimeout(() => {
                tooltip.style.display = 'none';
            }, 2000);
        }
        
        // 显示休息提示
        function showRestTooltip() {
            const tooltip = document.getElementById('rest-tooltip');
            tooltip.style.display = 'block';
            tooltip.style.left = '1016px';
            tooltip.style.top = '550px'; // 显示在热点区域上方
            
            setTimeout(() => {
                tooltip.style.display = 'none';
            }, 2000);
        }
        
        // 显示陷阱密码模态框
        function showTrapModal() {
            document.getElementById('password-modal').style.display = 'block';
            
            // 自动聚焦第一个输入框
            document.getElementById('digit1').focus();
        }
        
        // 隐藏密码输入模态框
        function hidePasswordModal() {
            document.getElementById('password-modal').style.display = 'none';
            
            // 清空输入
            document.getElementById('digit1').value = '';
            document.getElementById('digit2').value = '';
            document.getElementById('digit3').value = '';
            document.getElementById('digit4').value = '';
        }
        
        // 检查陷阱密码
        function checkTrapPassword() {
            hidePasswordModal();
            
            // 显示陷阱消息
            document.getElementById('trap-message').style.display = 'block';
            
            setTimeout(() => {
                document.getElementById('trap-message').style.display = 'none';
            }, 2000);
        }
        
        // 显示成功消息
        function showSuccessMessage() {
            document.getElementById('success-message').style.display = 'block';
        }
        
        // 前往下一个房间
        function goToNextRoom() {
            window.location.href = 'room4.html';
        }
        
        // 设置输入框自动跳转
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = document.querySelectorAll('#password-input input');
            
            inputs.forEach((input, index) => {
                input.addEventListener('input', function() {
                    if (this.value.length === 1) {
                        if (index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        }
                    }
                });
                
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && this.value.length === 0) {
                        if (index > 0) {
                            inputs[index - 1].focus();
                        }
                    }
                });
            });
        });
    </script>
</body>
</html>
