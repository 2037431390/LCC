<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密室逃脱 - 第二关</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #222;
            color: white;
        }
        
        #game-container {
            position: relative;
            width: 1280px;
            margin: 0 auto;
        }
        
        #room-image {
            display: block;
            width: 100%;
            height: auto;
        }
        
        .hotspot {
            position: absolute;
            cursor: pointer;
            /* 调试时可以取消下面的注释显示热点区域 */
            /* background-color: rgba(255, 0, 0, 0.3); */
        }
        
        .tooltip {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
            display: none;
            width: 200px;
            text-align: center;
        }
        
        .tooltip button {
            margin-top: 10px;
            padding: 5px 15px;
            cursor: pointer;
        }
        
        #password-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 10px;
            z-index: 200;
            display: none;
            text-align: center;
            width: 300px;
        }
        
        #password-input {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }
        
        #password-input input {
            width: 40px;
            height: 40px;
            text-align: center;
            font-size: 20px;
        }
        
        #modal-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        
        #modal-buttons button {
            padding: 8px 20px;
            cursor: pointer;
        }
        
        #confirm-exit {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
        
        #cancel-exit {
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 5px;
        }
        
        #success-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 10px;
            z-index: 200;
            display: none;
            text-align: center;
            width: 300px;
        }
        
        #success-message button {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 8px 20px;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <img id="room-image" src="room2.png" alt="密室第二关">
        
        <!-- 画后面的密码提示 -->
        <div class="hotspot" style="left: 1002px; top: 598px; width: 227px; height: 187px;" onclick="showPaintingTooltip()"></div>
        <div id="painting-tooltip" class="tooltip">
            密码在画后面
        </div>
        
        <!-- 空区域提示 -->
        <div class="hotspot" style="left: 713px; top: 227px; width: 84px; height: 83px;" onclick="showEmptyTooltip()"></div>
        <div id="empty-tooltip" class="tooltip">
            这里什么都没有
        </div>
        
        <!-- 水果区域提示 -->
        <div class="hotspot" style="left: 634px; top: 902px; width: 70px; height: 48px;" onclick="showFruitTooltip()"></div>
        <div id="fruit-tooltip" class="tooltip">
            要来点水果吗？
        </div>
        
        <!-- 书柜密码提示 -->
        <div class="hotspot" style="left: 481px; top: 463px; width: 99px; height: 103px;" onclick="showBookTooltip()"></div>
        <div id="book-tooltip" class="tooltip">
            密码在书柜上的一本橙色书本
        </div>
        
        <!-- 密码发现区域 -->
        <div class="hotspot" style="left: 729px; top: 566px; width: 27px; height: 37px;" onclick="showPassword()"></div>
        <div id="password-message" class="tooltip">
            恭喜你找到密码4521
        </div>
        
        <!-- 出口区域 -->
        <div class="hotspot" style="left: 872px; top: 815px; width: 110px; height: 118px;" onclick="showPasswordModal()"></div>
        
        <!-- 密码输入模态框 -->
        <div id="password-modal">
            <h3>输入密码</h3>
            <div id="password-input">
                <input type="text" maxlength="1" id="digit1">
                <input type="text" maxlength="1" id="digit2">
                <input type="text" maxlength="1" id="digit3">
                <input type="text" maxlength="1" id="digit4">
            </div>
            <div id="modal-buttons">
                <button id="confirm-exit" onclick="checkPassword()">确认</button>
                <button id="cancel-exit" onclick="hidePasswordModal()">取消</button>
            </div>
        </div>
        
        <!-- 成功消息 -->
        <div id="success-message">
            <p>你找到了脱出这个房间的线索</p>
            <button id="leave-button" onclick="goToNextRoom()">离开</button>
        </div>
    </div>

    <script>
        // 显示画后面的提示
        function showPaintingTooltip() {
            const tooltip = document.getElementById('painting-tooltip');
            tooltip.style.display = 'block';
            tooltip.style.left = '1002px';
            tooltip.style.top = '500px'; // 显示在热点区域上方
        }
        
        // 显示空区域提示
        function showEmptyTooltip() {
            const tooltip = document.getElementById('empty-tooltip');
            tooltip.style.display = 'block';
            tooltip.style.left = '713px';
            tooltip.style.top = '150px'; // 显示在热点区域上方
            
            setTimeout(() => {
                tooltip.style.display = 'none';
            }, 3000);
        }
        
        // 显示水果区域提示
        function showFruitTooltip() {
            const tooltip = document.getElementById('fruit-tooltip');
            tooltip.style.display = 'block';
            tooltip.style.left = '634px';
            tooltip.style.top = '820px'; // 显示在热点区域上方
            
            setTimeout(() => {
                tooltip.style.display = 'none';
            }, 3000);
        }
        
        // 显示书柜密码提示
        function showBookTooltip() {
            const tooltip = document.getElementById('book-tooltip');
            tooltip.style.display = 'block';
            tooltip.style.left = '481px';
            tooltip.style.top = '380px'; // 显示在热点区域上方
            
            setTimeout(() => {
                tooltip.style.display = 'none';
            }, 3000);
        }
        
        // 显示密码
        function showPassword() {
            const tooltip = document.getElementById('password-message');
            tooltip.style.display = 'block';
            tooltip.style.left = '729px';
            tooltip.style.top = '500px'; // 显示在热点区域上方
            
            setTimeout(() => {
                tooltip.style.display = 'none';
            }, 3000);
        }
        
        // 隐藏工具提示
        function hideTooltip(id) {
            document.getElementById(id).style.display = 'none';
        }
        
        // 显示密码输入模态框
        function showPasswordModal() {
            document.getElementById('password-modal').style.display = 'block';
            
            // 自动聚焦第一个输入框
            document.getElementById('digit1').focus();
        }
        
        // 隐藏密码输入模态框
        function hidePasswordModal() {
            document.getElementById('password-modal').style.display = 'none';
            
            // 清空输入
            document.getElementById('digit1').value = '';
            document.getElementById('digit2').value = '';
            document.getElementById('digit3').value = '';
            document.getElementById('digit4').value = '';
        }
        
        // 检查密码
        function checkPassword() {
            const digit1 = document.getElementById('digit1').value;
            const digit2 = document.getElementById('digit2').value;
            const digit3 = document.getElementById('digit3').value;
            const digit4 = document.getElementById('digit4').value;
            
            const password = digit1 + digit2 + digit3 + digit4;
            
            if (password === '4521') {
                hidePasswordModal();
                document.getElementById('success-message').style.display = 'block';
            } else {
                alert('密码错误，请再试一次！');
                hidePasswordModal();
            }
        }
        
        // 前往下一个房间
        function goToNextRoom() {
            window.location.href = 'room3.html';
        }
        
        // 设置输入框自动跳转
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = document.querySelectorAll('#password-input input');
            
            inputs.forEach((input, index) => {
                input.addEventListener('input', function() {
                    if (this.value.length === 1) {
                        if (index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        }
                    }
                });
                
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && this.value.length === 0) {
                        if (index > 0) {
                            inputs[index - 1].focus();
                        }
                    }
                });
            });
        });
    </script>
</body>
</html>
