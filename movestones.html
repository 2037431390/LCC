<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>形状消消乐 - 动态形状</title>
    <style>
        /* 全局样式 */
        :root {
            --primary-color: #4facfe;
            --secondary-color: #00f2fe;
            --accent-color: #FF5722;
            --success-color: #4CAF50;
            --warning-color: #FF9800;
            --danger-color: #F44336;
            --dark-color: #333;
            --light-color: #f5f7fa;
            --card-bg: rgba(255, 255, 255, 0.95);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, var(--light-color) 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--dark-color);
            overflow-x: hidden;
        }
        
        /* 返回按钮 */
        .back-btn {
            position: fixed;
            top: 25px;
            left: 25px;
            padding: 12px 20px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            font-size: 1.1rem;
        }
        
        .back-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            background: linear-gradient(135deg, #3a8fd9 0%, #00c8d6 100%);
        }
        
        .back-btn i {
            margin-right: 8px;
            font-size: 1.2rem;
        }
        
        /* 游戏容器 */
        .game-container {
            width: 90%;
            max-width: 800px;
            margin: 30px auto;
            padding: 30px;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 1;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        /* 游戏标题 */
        .game-title {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 15px;
            background: linear-gradient(to right, var(--primary-color) 0%, var(--secondary-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            letter-spacing: 1px;
        }
        
        /* 游戏信息 */
        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.3rem;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.7);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }
        
        .level-info {
            text-align: center;
            font-size: 1.3rem;
            margin-bottom: 20px;
            font-weight: bold;
            color: var(--primary-color);
            background: rgba(255, 255, 255, 0.7);
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }
        
        /* 游戏控制按钮 */
        .game-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .btn {
            padding: 12px 25px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            min-width: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .add-btn {
            background: linear-gradient(135deg, var(--success-color) 0%, #3d8b40 100%);
            color: white;
        }
        
        .start-pause-btn {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
        }
        
        /* 游戏板 */
        .game-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-gap: 15px;
            margin-bottom: 30px;
        }
        
        .cell {
            aspect-ratio: 1/1;
            background-color: rgba(240, 240, 240, 0.8);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.5);
        }
        
        .cell:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
            background-color: rgba(255, 255, 255, 0.9);
        }
        
        .shape {
            width: 80%;
            height: 80%;
            transition: all 0.3s ease;
        }
        
        /* 基础形状样式 */
        .square {
            background-color: currentColor;
            border-radius: 5px;
        }
        
        .circle {
            background-color: currentColor;
            border-radius: 50%;
        }
        
        .triangle {
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-bottom: 45px solid currentColor;
        }
        
        .star {
            position: relative;
            width: 50px;
            height: 50px;
            color: currentColor;
        }
        
        .star:before, .star:after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 50px;
            height: 50px;
            background: currentColor;
            clip-path: polygon(
                50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%
            );
        }
        
        .diamond {
            width: 40px;
            height: 40px;
            background-color: currentColor;
            transform: rotate(45deg);
        }
        
        .hexagon {
            position: relative;
            width: 45px;
            height: 25px;
            background-color: currentColor;
        }
        
        .hexagon:before, .hexagon:after {
            content: "";
            position: absolute;
            width: 0;
            border-left: 22px solid transparent;
            border-right: 22px solid transparent;
        }
        
        .hexagon:before {
            bottom: 100%;
            border-bottom: 12px solid currentColor;
        }
        
        .hexagon:after {
            top: 100%;
            border-top: 12px solid currentColor;
        }
        
        .pentagon {
            position: relative;
            width: 40px;
            height: 40px;
            background-color: currentColor;
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
        }
        
        /* 游戏结束弹窗 */
        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        
        .game-over.show {
            opacity: 1;
            pointer-events: all;
        }
        
        .game-over-content {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            transform: scale(0.9);
            animation: popIn 0.4s forwards;
        }
        
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            80% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .game-over-title {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: var(--primary-color);
            background: linear-gradient(to right, var(--primary-color) 0%, var(--secondary-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .restart-btn {
            background: linear-gradient(135deg, var(--warning-color) 0%, #e68a00 100%);
            color: white;
            padding: 12px 25px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .restart-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        .next-level-btn {
            background: linear-gradient(135deg, var(--success-color) 0%, #3d8b40 100%);
            color: white;
            padding: 12px 25px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .next-level-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        .combo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-color);
            opacity: 0;
            animation: floatUp 1s ease-out;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, -50%); }
            100% { opacity: 0; transform: translate(-50%, -120%); }
        }
        
        /* 背景装饰元素 */
        .bg-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        
        .bg-element {
            position: absolute;
            border-radius: 50%;
            background: rgba(79, 172, 254, 0.1);
            filter: blur(30px);
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .game-container {
                width: 95%;
                padding: 20px;
            }
            
            .game-title {
                font-size: 2.5rem;
            }
            
            .game-board {
                grid-gap: 10px;
            }
            
            .game-controls {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }
            
            .btn {
                width: 100%;
                max-width: 250px;
            }
            
            .back-btn {
                padding: 10px 15px;
                font-size: 1rem;
                top: 15px;
                left: 15px;
            }
        }
        
        @media (max-width: 480px) {
            .game-title {
                font-size: 2rem;
            }
            
            .game-info, .level-info {
                font-size: 1.1rem;
            }
            
            .cell {
                border-radius: 10px;
            }
        }
    </style>
    <!-- 引入Font Awesome图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- 背景装饰元素 -->
    <div class="bg-elements">
        <div class="bg-element" style="width: 300px; height: 300px; top: 10%; left: 5%;"></div>
        <div class="bg-element" style="width: 400px; height: 400px; bottom: 5%; right: 5%;"></div>
        <div class="bg-element" style="width: 250px; height: 250px; top: 30%; right: 10%;"></div>
    </div>
    
    <!-- 返回按钮 -->
    <a href="yxly.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> 返回首页
    </a>
    
    <!-- 游戏主容器 -->
    <div class="game-container">
        <h1 class="game-title">形状消消乐</h1>
        
        <div class="level-info">关卡: <span id="level">1</span> - 目标分数: <span id="targetScore">100</span></div>
        
        <div class="game-info">
            <div><i class="fas fa-star" style="color: var(--warning-color);"></i> 分数: <span id="score">0</span></div>
            <div><i class="fas fa-clock" style="color: var(--primary-color);"></i> 时间: <span id="timer">60</span>秒</div>
        </div>
        
        <div class="game-controls">
            <button class="btn start-pause-btn" id="startPauseBtn">
                <i class="fas fa-play" style="margin-right: 8px;"></i> 开始游戏
            </button>
            <button class="btn add-btn" id="addBtn">
                <i class="fas fa-plus" style="margin-right: 8px;"></i> 新增形状
            </button>
        </div>
        
        <div class="game-board" id="gameBoard"></div>
    </div>
    
    <!-- 游戏结束弹窗 -->
    <div class="game-over" id="gameOver">
        <div class="game-over-content">
            <h2 class="game-over-title" id="gameOverTitle">游戏结束</h2>
            <p id="gameOverMessage"></p>
            <button class="restart-btn" id="restartBtn">
                <i class="fas fa-redo" style="margin-right: 8px;"></i> 重新开始
            </button>
            <button class="next-level-btn" id="nextLevelBtn">
                <i class="fas fa-arrow-right" style="margin-right: 8px;"></i> 下一关卡
            </button>
        </div>
    </div>

    <script>
        // 游戏配置
        const config = {
            boardCols: 5,
            boardRows: 4,
            baseTimeLimit: 60,
            baseTargetScore: 100,
            scoreIncrement: 200,
            timeIncrement: 15,
            matchPoints: 10,
            initialLevel: 1,
            shapesPerLevel: 4
        };
        
        // 所有可用的形状类型
        const ALL_SHAPES = [
            { type: 'square', class: 'square', color: '#FF5252' },
            { type: 'circle', class: 'circle', color: '#4CAF50' },
            { type: 'triangle', class: 'triangle', color: '#2196F3' },
            { type: 'star', class: 'star', color: '#FFC107' },
            { type: 'diamond', class: 'diamond', color: '#AB47BC' },
            { type: 'hexagon', class: 'hexagon', color: '#26A69A' },
            { type: 'pentagon', class: 'pentagon', color: '#FF7043' }
        ];
        
        // 游戏状态
        let gameState = {
            board: [],
            score: 0,
            timeLeft: 0,
            isGameOver: false,
            isPaused: true,
            level: config.initialLevel,
            targetScore: config.baseTargetScore,
            timeLimit: config.baseTimeLimit,
            gameTimer: null,
            currentShapes: []
        };
        
        // DOM元素
        const gameBoard = document.getElementById('gameBoard');
        const scoreElement = document.getElementById('score');
        const timerElement = document.getElementById('timer');
        const levelElement = document.getElementById('level');
        const targetScoreElement = document.getElementById('targetScore');
        const startPauseBtn = document.getElementById('startPauseBtn');
        const addBtn = document.getElementById('addBtn');
        const gameOverElement = document.getElementById('gameOver');
        const gameOverTitle = document.getElementById('gameOverTitle');
        const gameOverMessage = document.getElementById('gameOverMessage');
        const restartBtn = document.getElementById('restartBtn');
        const nextLevelBtn = document.getElementById('nextLevelBtn');
        
        // 初始化游戏
        function initGame() {
            gameState = {
                board: Array(config.boardCols * config.boardRows).fill(null),
                score: 0,
                timeLeft: gameState.timeLimit || config.baseTimeLimit,
                isGameOver: false,
                isPaused: true,
                level: gameState.level || config.initialLevel,
                targetScore: gameState.targetScore || config.baseTargetScore,
                timeLimit: gameState.timeLimit || config.baseTimeLimit,
                gameTimer: null,
                currentShapes: getShapesForLevel(gameState.level || config.initialLevel)
            };
            
            levelElement.textContent = gameState.level;
            targetScoreElement.textContent = gameState.targetScore;
            startPauseBtn.innerHTML = '<i class="fas fa-play" style="margin-right: 8px;"></i> 开始游戏';
            
            gameBoard.innerHTML = '';
            
            for (let i = 0; i < config.boardCols * config.boardRows; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = i;
                cell.addEventListener('click', () => transformShape(i));
                gameBoard.appendChild(cell);
            }
            
            fillEmptyCells(5);
            updateScore();
            updateTimer();
        }
        
        // 开始/暂停游戏
        function toggleGame() {
            if (gameState.isGameOver) return;
            
            if (gameState.isPaused) {
                gameState.isPaused = false;
                startPauseBtn.innerHTML = '<i class="fas fa-pause" style="margin-right: 8px;"></i> 暂停游戏';
                startGameTimer();
            } else {
                gameState.isPaused = true;
                startPauseBtn.innerHTML = '<i class="fas fa-play" style="margin-right: 8px;"></i> 继续游戏';
                clearInterval(gameState.gameTimer);
            }
        }
        
        // 根据关卡获取形状组合
        function getShapesForLevel(level) {
            const shapesCount = Math.min(config.shapesPerLevel, ALL_SHAPES.length);
            const startIndex = (level - 1) % ALL_SHAPES.length;
            const selectedShapes = [];
            
            for (let i = 0; i < shapesCount; i++) {
                const index = (startIndex + i) % ALL_SHAPES.length;
                selectedShapes.push(ALL_SHAPES[index]);
            }
            
            return selectedShapes.sort(() => Math.random() - 0.5);
        }
        
        // 开始游戏计时
        function startGameTimer() {
            if (gameState.gameTimer) {
                clearInterval(gameState.gameTimer);
            }
            
            gameState.gameTimer = setInterval(() => {
                if (!gameState.isPaused) {
                    gameState.timeLeft--;
                    updateTimer();
                    
                    if (gameState.timeLeft <= 0) {
                        clearInterval(gameState.gameTimer);
                        endGame(false);
                    }
                }
            }, 1000);
        }
        
        // 变换形状
        function transformShape(index) {
            if (gameState.isGameOver || gameState.isPaused) return;
            if (gameState.board[index] === null) return;
            
            const currentShape = gameState.board[index];
            const currentShapeIndex = gameState.currentShapes.findIndex(s => s.type === currentShape.type);
            const nextShapeIndex = (currentShapeIndex + 1) % gameState.currentShapes.length;
            const nextShape = gameState.currentShapes[nextShapeIndex];
            
            gameState.board[index] = nextShape;
            updateCellAppearance(index);
            checkMatches();
        }
        
        // 新增形状
        function addRandomShape() {
            if (gameState.isGameOver || gameState.isPaused) return;
            
            const emptyCells = [];
            for (let i = 0; i < gameState.board.length; i++) {
                if (gameState.board[i] === null) {
                    emptyCells.push(i);
                }
            }
            
            if (emptyCells.length === 0) {
                endGame(false);
                return;
            }
            
            const randomIndex = Math.floor(Math.random() * emptyCells.length);
            const cellIndex = emptyCells[randomIndex];
            addShapeToCell(cellIndex);
            checkMatches();
        }
        
        // 添加形状到单元格
        function addShapeToCell(index) {
            const randomShapeIndex = Math.floor(Math.random() * gameState.currentShapes.length);
            const shape = gameState.currentShapes[randomShapeIndex];
            gameState.board[index] = shape;
            updateCellAppearance(index);
        }
        
        // 更新单元格外观
        function updateCellAppearance(index) {
            const cell = gameBoard.children[index];
            const shape = gameState.board[index];
            
            cell.innerHTML = '';
            
            if (shape === null) {
                cell.style.backgroundColor = 'rgba(240, 240, 240, 0.8)';
                return;
            }
            
            const shapeElement = document.createElement('div');
            shapeElement.className = `shape ${shape.class}`;
            shapeElement.style.color = shape.color;
            cell.appendChild(shapeElement);
        }
        
        // 填充空单元格
        function fillEmptyCells(count) {
            for (let i = 0; i < count; i++) {
                addRandomShape();
            }
        }
        
        // 检查匹配
        function checkMatches() {
            const matches = findMatches();
            
            if (matches.length > 0) {
                removeMatches(matches);
                gameState.score += matches.length * config.matchPoints;
                updateScore();
                showCombo(matches.length);
                
                if (gameState.score >= gameState.targetScore) {
                    endGame(true);
                    return;
                }
                
                setTimeout(() => {
                    fillEmptyCells(matches.length);
                    setTimeout(checkMatches, 300);
                }, 300);
            }
        }
        
        // 查找匹配
        function findMatches() {
            const matches = [];
            const visited = new Set();
            
            // 水平匹配
            for (let row = 0; row < config.boardRows; row++) {
                for (let col = 0; col < config.boardCols - 2; col++) {
                    const index = row * config.boardCols + col;
                    if (gameState.board[index] && 
                        gameState.board[index + 1] && 
                        gameState.board[index + 2] &&
                        gameState.board[index].type === gameState.board[index + 1].type &&
                        gameState.board[index].type === gameState.board[index + 2].type) {
                        
                        if (!visited.has(index)) matches.push(index);
                        if (!visited.has(index + 1)) matches.push(index + 1);
                        if (!visited.has(index + 2)) matches.push(index + 2);
                        
                        visited.add(index);
                        visited.add(index + 1);
                        visited.add(index + 2);
                    }
                }
            }
            
            // 垂直匹配
            for (let col = 0; col < config.boardCols; col++) {
                for (let row = 0; row < config.boardRows - 2; row++) {
                    const index = row * config.boardCols + col;
                    if (gameState.board[index] && 
                        gameState.board[index + config.boardCols] && 
                        gameState.board[index + config.boardCols * 2] &&
                        gameState.board[index].type === gameState.board[index + config.boardCols].type &&
                        gameState.board[index].type === gameState.board[index + config.boardCols * 2].type) {
                        
                        if (!visited.has(index)) matches.push(index);
                        if (!visited.has(index + config.boardCols)) matches.push(index + config.boardCols);
                        if (!visited.has(index + config.boardCols * 2)) matches.push(index + config.boardCols * 2);
                        
                        visited.add(index);
                        visited.add(index + config.boardCols);
                        visited.add(index + config.boardCols * 2);
                    }
                }
            }
            
            return matches;
        }
        
        // 移除匹配的形状
        function removeMatches(matches) {
            matches.forEach(index => {
                gameState.board[index] = null;
                updateCellAppearance(index);
                
                const cell = gameBoard.children[index];
                cell.style.transform = 'scale(0)';
                setTimeout(() => {
                    cell.style.transform = '';
                }, 300);
            });
        }
        
        // 显示连击效果
        function showCombo(count) {
            const comboText = document.createElement('div');
            comboText.className = 'combo';
            comboText.textContent = `连击! +${count * config.matchPoints}`;
            gameBoard.appendChild(comboText);
            
            setTimeout(() => {
                comboText.remove();
            }, 1000);
        }
        
        // 更新分数显示
        function updateScore() {
            scoreElement.textContent = gameState.score;
        }
        
        // 更新计时器显示
        function updateTimer() {
            timerElement.textContent = gameState.timeLeft;
            
            if (gameState.timeLeft <= 10) {
                timerElement.style.color = '#FF5252';
                timerElement.style.animation = 'pulse 0.5s infinite alternate';
            } else {
                timerElement.style.color = '';
                timerElement.style.animation = '';
            }
        }
        
        // 结束游戏
        function endGame(isWin) {
            gameState.isGameOver = true;
            gameState.isPaused = true;
            clearInterval(gameState.gameTimer);
            startPauseBtn.innerHTML = '<i class="fas fa-play" style="margin-right: 8px;"></i> 开始游戏';
            
            if (isWin) {
                gameOverTitle.textContent = `关卡 ${gameState.level} 完成!`;
                gameOverMessage.textContent = `你在${gameState.timeLimit - gameState.timeLeft}秒内达到了${gameState.score}分!`;
                nextLevelBtn.style.display = 'block';
            } else {
                gameOverTitle.textContent = "游戏结束";
                gameOverMessage.textContent = `你的得分是${gameState.score}分，目标是${gameState.targetScore}分`;
                nextLevelBtn.style.display = 'none';
            }
            
            gameOverElement.classList.add('show');
        }
        
        // 进入下一关
        function nextLevel() {
            gameState.level++;
            gameState.targetScore += config.scoreIncrement;
            gameState.timeLimit += config.timeIncrement;
            gameOverElement.classList.remove('show');
            initGame();
        }
        
        // 事件监听
        startPauseBtn.addEventListener('click', toggleGame);
        addBtn.addEventListener('click', addRandomShape);
        
        restartBtn.addEventListener('click', () => {
            gameState.level = config.initialLevel;
            gameState.targetScore = config.baseTargetScore;
            gameState.timeLimit = config.baseTimeLimit;
            gameOverElement.classList.remove('show');
            initGame();
        });
        
        nextLevelBtn.addEventListener('click', nextLevel);
        
        // 初始化游戏
        initGame();
    </script>
</body>
</html>
