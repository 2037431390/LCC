

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏乐园 - LC的个人网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f0f0f0;
            color: #333;
        }
        .header {
            background-color: #666633;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .nav-bar {
            display: flex;
            justify-content: center;
        }
        .nav-item {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            margin: 0 10px;
            border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.2);
        }
        .games-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }
        .game-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }
        .game-thumbnail {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .game-info {
            padding: 20px;
        }
        .game-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .game-description {
            color: #666;
            margin-bottom: 15px;
        }
        .play-button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #666633;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .play-button:hover {
            background-color: #777744;
        }
        .back-button {
            position: absolute;
            left: 20px;
            top: 20px;
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.1);
            transition: background-color 0.3s;
        }
        .back-button:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav-bar">
            <a href="yxly.html" class="nav-item">游戏乐园</a>
        </nav>
    </header>
    <main class="games-container">
        <div class="game-card">
            <img src="setp.png" alt="贪吃蛇游戏" class="game-thumbnail">
            <div class="game-info">
                <h3 class="game-title">贪吃蛇</h3>
                <p class="game-description">经典的贪吃蛇游戏，控制蛇移动并吃掉食物，注意不要撞到墙壁或自己的身体！</p>
                <a href="snake.html" class="play-button">开始游戏</a>
            </div>
        </div>
        
        <div class="game-card">
            <img src="zzltp.png" alt="专注力游戏" class="game-thumbnail">
            <div class="game-info">
                <h3 class="game-title">专注力游戏</h3>
                <p class="game-description">测试你的注意力和反应能力，点击出现的目标，挑战你的极限！</p>
                <a href="zzll.html" class="play-button">开始游戏</a>
            </div>
        </div>
        
        <div class="game-card">
            <img src="bsttp.png" alt="摆石头游戏" class="game-thumbnail">
            <div class="game-info">
                <h3 class="game-title">摆石头</h3>
                <p class="game-description">策略性的摆石头游戏，思考如何放置石头以获得最高分。</p>
                <a href="movestones.html" class="play-button">开始游戏</a>
            </div>
        </div>
        
        <div class="game-card">
            <img src="pgtp.png" alt="采集苹果游戏" class="game-thumbnail">
            <div class="game-info">
                <h3 class="game-title">采集苹果</h3>
                <p class="game-description">帮助果农收集掉落的苹果，不要让它们掉到地上！</p>
                <a href="apple.html" class="play-button">开始游戏</a>
            </div>
        </div>
        
        <div class="game-card">
            <img src="zztp.png" alt="接粽子游戏" class="game-thumbnail">
            <div class="game-info">
                <h3 class="game-title">接粽子</h3>
                <p class="game-description">传统节日游戏，控制容器接住掉落的粽子，体验节日氛围！</p>
                <a href="zongzi.html" class="play-button">开始游戏</a>
            </div>
        </div>
        
        <!-- 新添加的密室逃脱游戏卡片 -->
        <div class="game-card">
            <img src="room1.png" alt="密室逃脱游戏" class="game-thumbnail">
            <div class="game-info">
                <h3 class="game-title">密室逃脱</h3>
                <p class="game-description">挑战你的解谜能力，寻找线索逃离密室！</p>
                <a href="room1.html" class="play-button">开始游戏</a>
            </div>
        </div>
    </main>
    <footer class="footer">
        <p>© 2025 LC的个人网站 | 游戏乐园</p>
    </footer>
</body>
</html>
