<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桂林山水甲天下</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'STXingkai', '华文行楷', cursive;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1, .title-style {
            font-size: 32px;
            font-weight: bold;
            color: red;
        }

        .button-container {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }

        .button {
            width: 200px;
            height: 200px;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .button:hover {
            transform: scale(1.05);
        }

        #elephant-mountain {
            background-image: url('山.png');
        }

        #sun-moon-tower {
            background-image: url('塔.png');
        }

        #prompt {
            font-size: 32px;
            margin-bottom: 10px;
            color: red;
        }

        #score {
            font-size: 32px;
            color: red;
        }

        #progress-bar {
            width: 300px;
            height: 20px;
            background-color: #ddd;
            margin-top: 20px;
            border-radius: 10px;
            overflow: hidden;
        }

        #progress {
            height: 100%;
            background-color: #4CAF50;
            width: 100%;
            transition: width 1s linear;
        }

        #time-left {
            font-size: 32px;
            margin-top: 5px;
            color: red;
        }

        @keyframes bounce {
            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-20px);
            }

            60% {
                transform: translateY(-10px);
            }
        }

        @keyframes scale {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        .feedback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            color: orange;
            animation: bounce 1s;
            z-index: 10;
        }

        .level-btn {
            transition: all 0.3s;
        }

        .level-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        #easy:hover {
            background-color: #3b82f6 !important;
        }

        #medium:hover {
            background-color: #10b981 !important;
        }

        #hard:hover {
            background-color: #ef4444 !important;
        }

        /* 音乐控制按钮样式 */
        #music-control {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s;
        }

        #music-control:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: scale(1.1);
        }

        /* 返回按钮样式 */
        #back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s;
        }

        #back-button:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <!-- 返回按钮 -->
    <a id="back-button" href="yxly.html" title="返回">
        <i class="fas fa-arrow-left"></i>
    </a>

    <!-- 音乐控制按钮 -->
    <div id="music-control" title="背景音乐控制">
        <i class="fas fa-music"></i>
    </div>

    <h1>桂林山水甲天下</h1>
    <div class="button-container">
        <button id="easy" class="level-btn bg-blue-500 text-white px-4 py-2 rounded">初级</button>
        <button id="medium" class="level-btn bg-green-500 text-white px-4 py-2 rounded">中级</button>
        <button id="hard" class="level-btn bg-red-500 text-white px-4 py-2 rounded">高级</button>
    </div>
    <div class="button-container">
        <button id="start" class="bg-yellow-500 text-white px-4 py-2 rounded">开始训练</button>
        <button id="restart" class="bg-purple-500 text-white px-4 py-2 rounded hidden">重新开始</button>
    </div>
    <div class="button-container">
        <div style="display: flex; flex-direction: column; align-items: center;">
            <button id="elephant-mountain" class="button"></button>
            <span class="title-style">象鼻山</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center;">
            <button id="sun-moon-tower" class="button"></button>
            <span class="title-style">日月双塔</span>
        </div>
    </div>
    <div id="prompt"></div>
    <div id="score">分数: 0</div>
    <div id="progress-bar">
        <div id="progress"></div>
    </div>
    <div id="time-left">剩余时间: 60 秒</div>
    
    <!-- 音效 -->
    <audio id="ding-sound" src="https://www.soundjay.com/button/beep-07.wav" preload="auto"></audio>
    <audio id="good-sound" src="https://www.soundjay.com/voice/good-1.wav" preload="auto"></audio>
    <audio id="amazing-sound" src="https://www.soundjay.com/voice/amazing.wav" preload="auto"></audio>
    <audio id="unbelievable-sound" src="https://www.soundjay.com/voice/unbelievable.wav" preload="auto"></audio>
    
    <!-- 使用您准备的 gequ.M4A 作为背景音乐 -->
    <audio id="background-music" loop preload="auto">
        <source src="gequ.M4A" type="audio/mp4">
        您的浏览器不支持音频元素。
    </audio>

    <script>
        const easyBtn = document.getElementById('easy');
        const mediumBtn = document.getElementById('medium');
        const hardBtn = document.getElementById('hard');
        const startBtn = document.getElementById('start');
        const restartBtn = document.getElementById('restart');
        const elephantMountainBtn = document.getElementById('elephant-mountain');
        const sunMoonTowerBtn = document.getElementById('sun-moon-tower');
        const promptDiv = document.getElementById('prompt');
        const scoreDiv = document.getElementById('score');
        const progressBar = document.getElementById('progress');
        const timeLeftDiv = document.getElementById('time-left');
        const dingSound = document.getElementById('ding-sound');
        const goodSound = document.getElementById('good-sound');
        const amazingSound = document.getElementById('amazing-sound');
        const unbelievableSound = document.getElementById('unbelievable-sound');
        const backgroundMusic = document.getElementById('background-music');
        const musicControl = document.getElementById('music-control');
        const backButton = document.getElementById('back-button');

        let level = 'easy';
        let score = 0;
        let timeLeft = 60;
        let intervalId;
        let promptIntervalId;
        let consecutiveCorrect = 0;
        let lastPrompt = '';
        let isMusicPlaying = false;

        // 设置音乐音量适中(30%)
        backgroundMusic.volume = 0.3;

        // 音乐控制按钮事件
        musicControl.addEventListener('click', function() {
            if (isMusicPlaying) {
                backgroundMusic.pause();
                musicControl.innerHTML = '<i class="fas fa-music"></i>';
                musicControl.title = "播放背景音乐";
            } else {
                backgroundMusic.play().catch(e => {
                    console.log("音乐播放被阻止，请点击页面任意位置后重试");
                });
                musicControl.innerHTML = '<i class="fas fa-pause"></i>';
                musicControl.title = "暂停背景音乐";
            }
            isMusicPlaying = !isMusicPlaying;
        });

        // 页面点击事件解决自动播放限制
        document.addEventListener('click', function initAudio() {
            // 尝试播放背景音乐
            backgroundMusic.play()
                .then(() => {
                    isMusicPlaying = true;
                    musicControl.innerHTML = '<i class="fas fa-pause"></i>';
                    musicControl.title = "暂停背景音乐";
                })
                .catch(e => {
                    console.log("自动播放被阻止，请点击音乐控制按钮手动播放");
                });
            
            // 移除事件监听器，只需要执行一次
            document.removeEventListener('click', initAudio);
        }, { once: true });

        easyBtn.addEventListener('click', () => {
            level = 'easy';
            easyBtn.classList.add('ring-2', 'ring-offset-2', 'ring-blue-500');
            mediumBtn.classList.remove('ring-2', 'ring-offset-2', 'ring-green-500');
            hardBtn.classList.remove('ring-2', 'ring-offset-2', 'ring-red-500');
        });

        mediumBtn.addEventListener('click', () => {
            level = 'medium';
            mediumBtn.classList.add('ring-2', 'ring-offset-2', 'ring-green-500');
            easyBtn.classList.remove('ring-2', 'ring-offset-2', 'ring-blue-500');
            hardBtn.classList.remove('ring-2', 'ring-offset-2', 'ring-red-500');
        });

        hardBtn.addEventListener('click', () => {
            level = 'hard';
            hardBtn.classList.add('ring-2', 'ring-offset-2', 'ring-red-500');
            easyBtn.classList.remove('ring-2', 'ring-offset-2', 'ring-blue-500');
            mediumBtn.classList.remove('ring-2', 'ring-offset-2', 'ring-green-500');
        });

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', restartGame);

        elephantMountainBtn.addEventListener('click', () => {
            checkAnswer('elephant-mountain');
        });

        sunMoonTowerBtn.addEventListener('click', () => {
            checkAnswer('sun-moon-tower');
        });

        function startGame() {
            // 确保背景音乐播放
            if (!isMusicPlaying) {
                backgroundMusic.play()
                    .then(() => {
                        isMusicPlaying = true;
                        musicControl.innerHTML = '<i class="fas fa-pause"></i>';
                        musicControl.title = "暂停背景音乐";
                    })
                    .catch(e => {
                        console.log("音乐播放被阻止，请点击音乐控制按钮手动播放");
                    });
            }
            
            startBtn.classList.add('hidden');
            restartBtn.classList.remove('hidden');
            score = 0;
            timeLeft = 60;
            consecutiveCorrect = 0;
            lastPrompt = '';
            scoreDiv.textContent = `分数: ${score}`;
            progressBar.style.width = '100%';
            timeLeftDiv.textContent = `剩余时间: ${timeLeft} 秒`;

            intervalId = setInterval(() => {
                timeLeft--;
                progressBar.style.width = `${(timeLeft / 60) * 100}%`;
                timeLeftDiv.textContent = `剩余时间: ${timeLeft} 秒`;
                if (timeLeft === 0) {
                    clearInterval(intervalId);
                    clearInterval(promptIntervalId);
                    alert(`游戏结束！你的分数是: ${score}`);
                    restartGame();
                }
            }, 1000);

            showPrompt();
            let changeTime;
            if (level === 'easy') {
                changeTime = 3000;
            } else if (level === 'medium') {
                changeTime = 2000;
            } else if (level === 'hard') {
                changeTime = 1000;
            }
            promptIntervalId = setInterval(showPrompt, changeTime);
        }

        function restartGame() {
            clearInterval(intervalId);
            clearInterval(promptIntervalId);
            startBtn.classList.remove('hidden');
            restartBtn.classList.add('hidden');
            promptDiv.textContent = '';
            progressBar.style.width = '100%';
            timeLeftDiv.textContent = `剩余时间: 60 秒`;
        }

        function showPrompt() {
            const prompts = [
                '请点击象鼻山',
                '请点击日月双塔',
                '不要点象鼻山',
                '不要点日月双塔'
            ];
            
            const availablePrompts = prompts.filter(prompt => prompt !== lastPrompt);
            
            const randomIndex = Math.floor(Math.random() * availablePrompts.length);
            const prompt = availablePrompts[randomIndex];
            lastPrompt = prompt;
            
            promptDiv.textContent = prompt;
            promptDiv.style.color = getRandomColor();
            promptDiv.animate([
                { transform: 'scale(1)' },
                { transform: 'scale(1.2)' },
                { transform: 'scale(1)' }
            ], {
                duration: 500,
                easing: 'ease-out'
            });

            dingSound.play();
        }

        function checkAnswer(answer) {
            const prompt = promptDiv.textContent;
            let correct = false;
            if (prompt === '请点击象鼻山' && answer === 'elephant-mountain') {
                correct = true;
            } else if (prompt === '请点击日月双塔' && answer === 'sun-moon-tower') {
                correct = true;
            } else if (prompt === '不要点象鼻山' && answer === 'sun-moon-tower') {
                correct = true;
            } else if (prompt === '不要点日月双塔' && answer === 'elephant-mountain') {
                correct = true;
            }

            if (correct) {
                consecutiveCorrect++;
                updateScore(1);
                if (consecutiveCorrect === 3) {
                    showFeedback('good');
                } else if (consecutiveCorrect === 5) {
                    showFeedback('amazing');
                } else if (consecutiveCorrect === 8) {
                    showFeedback('unbelievable');
                    consecutiveCorrect = 0;
                }
            } else {
                consecutiveCorrect = 0;
                updateScore(-1);
            }

            if ('vibrate' in navigator) {
                navigator.vibrate(100);
            }
        }

        function updateScore(change) {
            score += change;
            scoreDiv.textContent = `分数: ${score}`;
            scoreDiv.animate([
                { transform: 'translateY(0)' },
                { transform: 'translateY(-20px)' },
                { transform: 'translateY(0)' }
            ], {
                duration: 300,
                easing: 'ease-out'
            });
        }

        function getRandomColor() {
            const colors = ['red', 'blue', 'green'];
            const randomIndex = Math.floor(Math.random() * colors.length);
            return colors[randomIndex];
        }

        function showFeedback(type) {
            let message = '';
            let sound;
            switch (type) {
                case 'good':
                    message = 'good';
                    sound = goodSound;
                    break;
                case 'amazing':
                    message = 'amazing';
                    sound = amazingSound;
                    break;
                case 'unbelievable':
                    message = 'Unbelievable';
                    sound = unbelievableSound;
                    break;
            }
            const feedbackDiv = document.createElement('div');
            feedbackDiv.classList.add('feedback');
            feedbackDiv.textContent = message;
            document.body.appendChild(feedbackDiv);
            setTimeout(() => {
                feedbackDiv.remove();
            }, 1000);
            sound.play();
        }
    </script>
</body>

</html>
