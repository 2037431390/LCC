<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密室逃脱 - 第一关</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #222;
            color: white;
        }
        
        #game-container {
            position: relative;
            width: fit-content;
        }
        
        #room-image {
            display: block;
        }
        
        .hotspot {
            position: absolute;
            cursor: pointer;
            /* border: 1px solid red; 调试时可以取消注释查看热点区域 */
        }
        
        .popup {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
            max-width: 200px;
            text-align: center;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        #password-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #333;
            padding: 20px;
            border-radius: 10px;
            z-index: 1000;
            text-align: center;
        }
        
        #password-input {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        
        #password-input input {
            width: 40px;
            height: 50px;
            margin: 0 5px;
            font-size: 24px;
            text-align: center;
        }
        
        #submit-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }
        
        #submit-btn:hover {
            background-color: #45a049;
        }
        
        #message-box {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #333;
            padding: 20px;
            border-radius: 10px;
            z-index: 1001;
            text-align: center;
            max-width: 300px;
        }
        
        #message-content {
            margin-bottom: 20px;
        }
        
        #message-ok {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <img id="room-image" src="room1.png" alt="密室房间">
        
        <!-- 密码热点区域 -->
        <div class="hotspot" style="width: 97px; height: 90px; top: 497px; left: 710px;" 
             onclick="showPopup('你找到了密码1206', this)"></div>
        
        <!-- 画热点区域 -->
        <div class="hotspot" style="width: 228px; height: 180px; top: 296px; left: 187px;" 
             onclick="showPopup('这幅画真好看', this)"></div>
        
        <!-- 电脑热点区域 -->
        <div class="hotspot" style="width: 66px; height: 124px; top: 563px; left: 1115px;" 
             onclick="showPopup('电脑坏了', this)"></div>
        
        <!-- 门锁热点区域 -->
        <div class="hotspot" style="width: 116px; height: 52px; top: 704px; left: 807px;" 
             onclick="showPasswordModal()"></div>
    </div>
    
    <!-- 密码输入模态框 -->
    <div id="password-modal">
        <h2>请输入密码</h2>
        <div id="password-input">
            <input type="password" maxlength="1" oninput="moveToNext(this)">
            <input type="password" maxlength="1" oninput="moveToNext(this)">
            <input type="password" maxlength="1" oninput="moveToNext(this)">
            <input type="password" maxlength="1" oninput="moveToNext(this)">
        </div>
        <button id="submit-btn" onclick="checkPassword()">确认</button>
    </div>
    
    <!-- 自定义消息框 -->
    <div id="message-box">
        <div id="message-content"></div>
        <button id="message-ok" onclick="hideMessage()">离开</button>
    </div>
    
    <script>
        // 显示弹出消息
        function showPopup(message, element) {
            // 移除现有的弹出框
            const existingPopup = document.querySelector('.popup');
            if (existingPopup) {
                existingPopup.remove();
            }
            
            // 创建新的弹出框
            const popup = document.createElement('div');
            popup.className = 'popup';
            popup.textContent = message;
            
            // 定位弹出框
            const rect = element.getBoundingClientRect();
            popup.style.left = `${rect.left}px`;
            popup.style.top = `${rect.top - 40}px`;
            
            document.body.appendChild(popup);
            
            // 2秒后自动消失
            setTimeout(() => {
                popup.remove();
            }, 2000);
        }
        
        // 显示密码输入模态框
        function showPasswordModal() {
            document.getElementById('password-modal').style.display = 'block';
            // 清空输入框
            const inputs = document.querySelectorAll('#password-input input');
            inputs.forEach(input => input.value = '');
            // 聚焦第一个输入框
            inputs[0].focus();
        }
        
        // 自动跳转到下一个输入框
        function moveToNext(input) {
            if (input.value.length === 1) {
                const next = input.nextElementSibling;
                if (next) {
                    next.focus();
                }
            }
        }
        
        // 显示自定义消息
        function showMessage(message) {
            document.getElementById('message-content').textContent = message;
            document.getElementById('message-box').style.display = 'block';
        }
        
        // 隐藏自定义消息
        function hideMessage() {
            document.getElementById('message-box').style.display = 'none';
        }
        
        // 检查密码
        function checkPassword() {
            const inputs = document.querySelectorAll('#password-input input');
            const password = Array.from(inputs).map(input => input.value).join('');
            
            if (password === '1206') {
                showMessage('你找到了脱出这个房间的线索');
                // 隐藏密码输入框
                document.getElementById('password-modal').style.display = 'none';
                // 2秒后跳转到第二关
                setTimeout(() => {
                    window.location.href = 'room2.html';
                }, 2000);
            } else {
                showMessage('密码错误，请再试一次');
                // 清空输入框并重新聚焦第一个
                inputs.forEach(input => input.value = '');
                inputs[0].focus();
            }
        }
    </script>
</body>
</html>
